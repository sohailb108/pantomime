# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-pwa/package-lock.json
      - run: npm ci
      # The PWA mode has its own dependencies (service worker registration, Workbox).
      - run: npm ci --prefix src-pwa
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test
      # The default build uses relative paths, so it works under /<repo>/ and later under any
      # folder of another host without changes.
      - run: npx quasar build -m pwa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
